name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  HF_SPACE_ID: smartcopradryer/smart-copra-fastapi

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show sync target
        run: |
          echo "GitHub repository: $GITHUB_REPOSITORY"
          echo "Hugging Face Space: $HF_SPACE_ID"

      - name: Sync repository to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker